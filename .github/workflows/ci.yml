name: BRATS CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Code Quality & Security
  # Runs ESLint, Prettier, TypeScript check, npm audit, and auto-fixes code style.
  # ---------------------------------------------------------------------------
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Auto-fix ESLint
        run: npm run lint:fix || true

      - name: Auto-fix Prettier
        run: npm run format || true

      - name: Commit auto-fixes on main pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "[AUTO] eslint --fix + prettier --write"
          git push

      - name: Verify ESLint (no remaining errors)
        run: npm run lint

      - name: Verify Prettier (no remaining diffs)
        run: npm run format:check

      - name: TypeScript strict check
        run: npm run type-check

  # ---------------------------------------------------------------------------
  # Job 2 — Tests
  # Runs Vitest unit tests with coverage enforcement (≥80% on src/lib/).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests & Coverage
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3 — Deploy to Vercel
  # Deploys to production on main/tag pushes when the Vercel secrets exist.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Check Vercel configuration
        id: vercel-config
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [[ -z "$VERCEL_TOKEN" ]] && missing+=(VERCEL_TOKEN)
          [[ -z "$VERCEL_ORG_ID" ]] && missing+=(VERCEL_ORG_ID)
          [[ -z "$VERCEL_PROJECT_ID" ]] && missing+=(VERCEL_PROJECT_ID)

          if ((${#missing[@]} > 0)); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel deployment skipped; missing repository secrets: ${missing[*]}"
            {
              echo "## Vercel deployment skipped"
              echo
              echo "Configure the missing repository secrets before enabling production deploys: \`${missing[*]}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        if: steps.vercel-config.outputs.configured == 'true'
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        if: steps.vercel-config.outputs.configured == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.vercel-config.outputs.configured == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.vercel-config.outputs.configured == 'true'
        run: npm install --global vercel@59.23.1

      - name: Pull Vercel environment
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Validate Vercel runtime environment
        if: steps.vercel-config.outputs.configured == 'true'
        shell: bash
        run: |
          missing=()
          # DIRECT_URL is only needed by Prisma migration commands, not by the
          # application build or runtime deployment.
          for key in NEXTAUTH_SECRET DATABASE_URL; do
            if ! grep -q "^${key}=" .env.production.local 2>/dev/null; then
              missing+=("$key")
            fi
          done

          if ((${#missing[@]} > 0)); then
            echo "::error::Vercel production environment is missing: ${missing[*]}"
            exit 1
          fi

      - name: Build project artifacts
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
