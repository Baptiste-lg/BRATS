name: BRATS CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Code Quality & Security
  # Runs the checks against the exact commit that downstream jobs will build.
  # ---------------------------------------------------------------------------
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Verify ESLint
        run: npm run lint

      - name: Verify Prettier
        run: npm run format:check

      - name: TypeScript check
        run: npm run type-check

      - name: Production build
        env:
          DATABASE_URL: postgresql://brats:brats@localhost:5432/brats
          DIRECT_URL: postgresql://brats:brats@localhost:5432/brats
          NEXTAUTH_SECRET: ci-build-secret
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 2 — Tests
  # Runs Vitest unit tests with coverage enforcement (≥80% on src/lib/).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests & Coverage
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3 — End-to-end tests
  # Runs the public/auth flows against the same production build shape.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-End Tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brats
          POSTGRES_PASSWORD: brats
          POSTGRES_DB: brats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brats -d brats"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brats:brats@localhost:5432/brats
      DIRECT_URL: postgresql://brats:brats@localhost:5432/brats
      NEXTAUTH_SECRET: ci-e2e-secret
      NEXTAUTH_URL: http://localhost:3000
      EMAIL_SERVER: smtp://user:password@localhost:2525
      EMAIL_FROM: BRATS <noreply@example.com>

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create test schema
        run: npx prisma db push --accept-data-loss

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4 — Deploy to Vercel
  # Deploys to production on main/tag pushes when the Vercel secrets exist.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Vercel
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Check Vercel configuration
        id: vercel-config
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [[ -z "$VERCEL_TOKEN" ]] && missing+=(VERCEL_TOKEN)
          [[ -z "$VERCEL_ORG_ID" ]] && missing+=(VERCEL_ORG_ID)
          [[ -z "$VERCEL_PROJECT_ID" ]] && missing+=(VERCEL_PROJECT_ID)

          if ((${#missing[@]} > 0)); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel deployment skipped; missing repository secrets: ${missing[*]}"
            {
              echo "## Vercel deployment skipped"
              echo
              echo "Configure the missing repository secrets before enabling production deploys: \`${missing[*]}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        if: steps.vercel-config.outputs.configured == 'true'
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        if: steps.vercel-config.outputs.configured == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.vercel-config.outputs.configured == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.vercel-config.outputs.configured == 'true'
        run: npm install --global vercel@59.23.1

      - name: Pull Vercel environment
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Validate Vercel runtime environment
        if: steps.vercel-config.outputs.configured == 'true'
        shell: bash
        run: |
          missing=()
          # DIRECT_URL is only needed by Prisma migration commands, not by the
          # application build or runtime deployment.
          for key in NEXTAUTH_SECRET DATABASE_URL; do
            if ! grep -q "^${key}=" .env.production.local 2>/dev/null; then
              missing+=("$key")
            fi
          done

          if ((${#missing[@]} > 0)); then
            echo "::error::Vercel production environment is missing: ${missing[*]}"
            exit 1
          fi

      - name: Build project artifacts
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
